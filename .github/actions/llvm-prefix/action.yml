name: llvm-prefix
description: >
  The pinned LLVM + MLIR + lld prefix of llvm/build.sh (Windows:
  llvm/build.ps1), named by ROK_LLVM_PREFIX. It is downloaded from the
  public rok-lang-artifacts S3 bucket (llvm/<version>/<host>/llvm.tar.gz)
  and verified by SHA-256,
  with the actions cache as a fast layer on a GitHub-hosted runner; on a
  self-hosted runner it stays in ROK_CI_HOME (which also holds the cargo
  target directory, one per runner). The prefixes are built and published
  by prefixes.yml (Windows by prefixes-windows.yml from the box),
  not here. Windows: the MSVC environment is exported for every later step.

inputs:
  root:
    description: The implementation checkout, relative to the workspace, with a trailing slash.
    default: ""
  arch:
    description: The runner architecture (X64, ARM64) whose prefix to take instead of this runner's (an emulated rokc).
    default: ""
  build:
    description: Deprecated and ignored; the prefix is downloaded, never built here.
    default: ""
  use:
    description: Deprecated and ignored.
    default: ""

outputs:
  prefix:
    value: ${{ steps.where.outputs.prefix }}

runs:
  using: composite
  steps:
    # cl / lib for rokc_llvm's shim, the whole developer environment for
    # build.ps1. VCINSTALLDIR / VSINSTALLDIR stay unset: rustc then finds
    # MSVC's link.exe itself, never Git's /usr/bin/link.
    - name: MSVC environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'no Visual Studio with the MSVC x64 tools' }
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notin 'VCINSTALLDIR', 'VSINSTALLDIR' -and
              [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
            "$($Matches[1])=$($Matches[2])"
          }
        } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    - id: where
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        ARCH: ${{ inputs.arch }}
        ENVIRONMENT: ${{ runner.environment }}
        HASH: ${{ runner.os == 'Windows' && hashFiles(format('{0}llvm/build.ps1', inputs.root), format('{0}llvm/rok-msvc.profdata.tar.xz', inputs.root)) || hashFiles(format('{0}llvm/build.sh', inputs.root), format('{0}llvm/rok.profdata.xz', inputs.root), format('{0}llvm/patches/*.patch', inputs.root)) }}
      run: |
        v=$(sed -n 's/^VERSION=//p' "${ROOT}llvm/build.sh")
        arch=${ARCH:-$RUNNER_ARCH}
        os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        case "$arch" in ARM64|arm64) ha=arm64 ;; X64|x64) ha=x64 ;; *) ha=$(printf '%s' "$arch" | tr '[:upper:]' '[:lower:]') ;; esac
        case "$os-$ha" in
          macos-arm64)   triple=aarch64-apple-darwin ;;
          macos-x64)     triple=x86_64-apple-darwin ;;
          linux-arm64)   triple=aarch64-unknown-linux-gnu ;;
          linux-x64)     triple=x86_64-unknown-linux-gnu ;;
          windows-arm64) triple=aarch64-pc-windows-msvc ;;
          windows-x64)   triple=x86_64-pc-windows-msvc ;;
          *) echo "::error::no prefix target triple for host $os-$ha"; exit 1 ;;
        esac
        if [ "$ENVIRONMENT" = self-hosted ]; then
          home=${ROK_CI_HOME:?the self-hosted runner sets ROK_CI_HOME, its persistent directory (docs/ci.md)}
          p=$home/llvm-$v-$arch-${HASH:0:16}
          [ -f "$p/.complete" ] && echo "hit=true" >>"$GITHUB_OUTPUT"
          echo "CARGO_TARGET_DIR=$home/target/$RUNNER_NAME" >>"$GITHUB_ENV"
        elif [ "$RUNNER_OS" = Windows ]; then
          p="$LOCALAPPDATA\\rok\\llvm-$v"
        else
          p=$HOME/.cache/rok/llvm-$v
        fi
        echo "prefix=$p" >>"$GITHUB_OUTPUT"
        echo "key=llvm-$v-$RUNNER_OS-$arch-$HASH" >>"$GITHUB_OUTPUT"
        echo "v=$v" >>"$GITHUB_OUTPUT"
        echo "triple=$triple" >>"$GITHUB_OUTPUT"
        echo "ROK_LLVM_PREFIX=$p" >>"$GITHUB_ENV"

    # Fast layer: the cache that the first job of a run populates from the
    # asset below; a miss (new branch, evicted) falls through to a download.
    - id: cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.where.outputs.key }}

    # Source of truth: the versioned, SHA-256-verified prefix in the public
    # rok-lang-artifacts S3 bucket (llvm/<v>/<host>/llvm.tar.gz, uploaded by
    # prefixes.yml). A self-hosted runner downloads only when its
    # ROK_CI_HOME has no complete prefix.
    - name: Download prefix
      if: steps.cache.outputs.cache-hit != 'true' && steps.where.outputs.hit != 'true'
      shell: bash
      env:
        BASE: https://rok-lang-artifacts.s3.us-east-1.amazonaws.com
        V: ${{ steps.where.outputs.v }}
        TRIPLE: ${{ steps.where.outputs.triple }}
      run: |
        pfx=$ROK_LLVM_PREFIX
        tmp=$RUNNER_TEMP
        if [ "$RUNNER_OS" = Windows ]; then
          pfx=$(cygpath -u "$ROK_LLVM_PREFIX")
          tmp=$(cygpath -u "$RUNNER_TEMP")
        fi
        dir=$(dirname "$pfx")
        mkdir -p "$dir"
        a=rok-llvm-$V-$TRIPLE.tar.gz
        url=$BASE/llvm/$V/$TRIPLE/llvm.tar.gz
        curl -fsSL "$url"        -o "$tmp/$a"
        curl -fsSL "$url.sha256" -o "$tmp/$a.sha256"
        want=$(cut -d' ' -f1 "$tmp/$a.sha256")
        if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum "$tmp/$a" | cut -d' ' -f1); else got=$(shasum -a 256 "$tmp/$a" | cut -d' ' -f1); fi
        [ "$want" = "$got" ] || { echo "::error::sha256 mismatch for $a ($got != $want)"; exit 1; }
        tar -xzf "$tmp/$a" -C "$dir"
        # The tarball holds llvm-<v>/; a self-hosted prefix is named with its
        # arch and hash, so move it into place when the names differ.
        ext="$dir/llvm-$V"
        [ "$ext" = "$pfx" ] || { rm -rf "$pfx"; mv "$ext" "$pfx"; }
        [ -e "$pfx/.complete" ] || { echo "::error::$a did not extract a complete prefix at $pfx"; exit 1; }
        rm -f "$tmp/$a" "$tmp/$a.sha256"

    - name: Save cache
      if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.where.outputs.key }}
