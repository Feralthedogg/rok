name: llvm-prefix
description: >
  The pinned LLVM + MLIR + lld prefix of llvm/build.sh (Windows:
  llvm/build.ps1), named by ROK_LLVM_PREFIX: restored from the actions
  cache on a GitHub-hosted runner; on a self-hosted one kept in
  ROK_CI_HOME (the runner's environment), which also holds the cargo
  target directory (CARGO_TARGET_DIR, one per runner). With build, a
  missing prefix is built, stripped and saved instead; without, a
  missing prefix fails the job. Windows: the MSVC environment is
  exported for every later step.

inputs:
  root:
    description: The implementation checkout, relative to the workspace, with a trailing slash.
    default: ""
  build:
    description: Build and save the prefix when the cache has none.
    default: "false"
  arch:
    description: The runner architecture (X64, ARM64) whose prefix to take instead of this runner's (an emulated rokc).
    default: ""

outputs:
  prefix:
    value: ${{ steps.where.outputs.prefix }}

runs:
  using: composite
  steps:
    # cl / lib for rokc_llvm's shim, the whole developer environment for
    # build.ps1. VCINSTALLDIR / VSINSTALLDIR stay unset: rustc then finds
    # MSVC's link.exe itself, never Git's /usr/bin/link.
    - name: MSVC environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'no Visual Studio with the MSVC x64 tools' }
        cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$' -and $Matches[1] -notin 'VCINSTALLDIR', 'VSINSTALLDIR' -and
              [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
            "$($Matches[1])=$($Matches[2])"
          }
        } | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    - id: where
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        ARCH: ${{ inputs.arch }}
        ENVIRONMENT: ${{ runner.environment }}
        HASH: ${{ runner.os == 'Windows' && hashFiles(format('{0}llvm/build.ps1', inputs.root), format('{0}llvm/rok-msvc.profdata.tar.xz', inputs.root), format('{0}.github/actions/llvm-prefix/action.yml', inputs.root)) || hashFiles(format('{0}llvm/build.sh', inputs.root), format('{0}llvm/rok.profdata.xz', inputs.root), format('{0}llvm/patches/*.patch', inputs.root)) }}
      run: |
        v=$(sed -n 's/^VERSION=//p' "${ROOT}llvm/build.sh")
        arch=${ARCH:-$RUNNER_ARCH}
        if [ "$ENVIRONMENT" = self-hosted ]; then
          home=${ROK_CI_HOME:?the self-hosted runner sets ROK_CI_HOME, its persistent directory (docs/ci.md)}
          p=$home/llvm-$v-$arch-${HASH:0:16}
          [ -f "$p/.complete" ] && echo "hit=true" >>"$GITHUB_OUTPUT"
          echo "CARGO_TARGET_DIR=$home/target/$RUNNER_NAME" >>"$GITHUB_ENV"
        elif [ "$RUNNER_OS" = Windows ]; then
          p="$LOCALAPPDATA\\rok\\llvm-$v"
        else
          p=$HOME/.cache/rok/llvm-$v
        fi
        echo "prefix=$p" >>"$GITHUB_OUTPUT"
        echo "key=llvm-$v-$RUNNER_OS-$arch-$HASH" >>"$GITHUB_OUTPUT"
        echo "ROK_LLVM_PREFIX=$p" >>"$GITHUB_ENV"

    - id: cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.where.outputs.key }}
        lookup-only: ${{ inputs.build }}
        fail-on-cache-miss: ${{ inputs.build != 'true' }}

    - name: Missing (self-hosted)
      if: runner.environment == 'self-hosted' && steps.where.outputs.hit != 'true' && inputs.build != 'true'
      shell: bash
      run: |
        echo "::error::no LLVM prefix at $ROK_LLVM_PREFIX (the llvm job builds it)"
        exit 1

    # The build tree needs ~15 GB more than a runner's free disk.
    - name: Free disk (Linux)
      if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
        df -h "$HOME"

    # clang reads llvm/rok.profdata.xz (indexed format 12: clang 19+);
    # Ubuntu 24.04's default clang is 18 and its c++ is gcc. A
    # self-hosted runner has clang-19 installed.
    - name: Build (Unix)
      if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.where.outputs.hit != 'true' && runner.os != 'Windows'
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        ENVIRONMENT: ${{ runner.environment }}
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          if [ "$ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q clang-19
          fi
          export CC=clang-19 CXX=clang++-19
        fi
        "${ROOT}llvm/build.sh" "$ROK_LLVM_PREFIX" 2>&1 | tee "$RUNNER_TEMP/llvm-build.log"
        if grep -q 'without PGO' "$RUNNER_TEMP/llvm-build.log"; then
          echo "::error::the LLVM prefix was built without llvm/rok.profdata.xz"
          exit 1
        fi

    # llvm/rok-msvc.profdata.tar.xz is read by clang-cl 22+ only (cl
    # reads no clang profile): the pinned release's clang-cl and resource
    # headers, nothing installed. Its version is in this file, hence in
    # the Windows cache key.
    - name: clang-cl (Windows)
      id: clang
      if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.where.outputs.hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $v = '22.1.8'
        $n, $sha = switch ($env:RUNNER_ARCH) {
          'X64' { "clang+llvm-$v-x86_64-pc-windows-msvc", 'd96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234' }
          'ARM64' { "clang+llvm-$v-aarch64-pc-windows-msvc", 'de718c58ebbc5f61d58c17b90457fcf42983bc2c4a4aba3e010d108713bfd7f1' }
        }
        $tar = "$env:RUNNER_TEMP\$n.tar.xz"
        Invoke-WebRequest -UseBasicParsing -OutFile $tar `
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/$n.tar.xz"
        if ((Get-FileHash -Algorithm SHA256 $tar).Hash.ToLower() -ne $sha) { throw "checksum mismatch for $tar" }
        & "$env:SystemRoot\System32\tar.exe" -xf $tar -C $env:RUNNER_TEMP "$n/bin/clang-cl.exe" "$n/lib/clang"
        if ($LASTEXITCODE) { throw "cannot unpack $tar" }
        Remove-Item $tar
        "cl=$env:RUNNER_TEMP\$n\bin\clang-cl.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

    - name: Build (Windows)
      if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.where.outputs.hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        ROOT: ${{ inputs.root }}
        CC: ${{ steps.clang.outputs.cl }}
        CXX: ${{ steps.clang.outputs.cl }}
      run: |
        & "${env:ROOT}llvm/build.ps1" $env:ROK_LLVM_PREFIX *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\llvm-build.log"
        if (Select-String -Quiet -Path "$env:RUNNER_TEMP\llvm-build.log" -Pattern 'without PGO') {
          Write-Output '::error::the LLVM prefix was built without llvm/rok-msvc.profdata.tar.xz'
          exit 1
        }

    # What rokc_llvm's build.rs does not read: shared libraries, the
    # object libraries, opt-viewer; on Windows also bin/, where lld is five
    # copies, not links (targets/build.sh needs bin/ld.lld on Unix only).
    # A self-hosted prefix is marked complete last.
    - name: Strip
      if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' && steps.where.outputs.hit != 'true'
      shell: bash
      run: |
        cd "$ROK_LLVM_PREFIX"
        rm -rf lib/objects-Release share/opt-viewer lib/*.dylib lib/*.so lib/*.so.*
        if [ "$RUNNER_OS" = Windows ]; then rm -rf bin; fi
        du -sh .
        touch .complete

    - name: Save
      if: inputs.build == 'true' && steps.cache.outputs.cache-hit != 'true' && runner.environment == 'github-hosted'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
