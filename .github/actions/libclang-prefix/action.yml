name: libclang-prefix
description: >
  The pinned libclang of llvm/build-libclang.sh (Windows:
  llvm/build-libclang.ps1), named by ROK_LIBCLANG_PREFIX. Downloaded from
  the prefixes-<version> release's published asset and verified by
  SHA-256, with the actions cache as a fast layer on a GitHub-hosted
  runner; it stays in the default cache directory on a self-hosted runner.
  Published by build-prefixes.yml (Windows by seed-llvm-windows.yml), apart
  from the LLVM prefix. Run after llvm-prefix (Windows: its MSVC environment).

inputs:
  arch:
    description: The runner architecture (X64, ARM64) whose prefix to take instead of this runner's.
    default: ""
  build:
    description: Deprecated and ignored; the prefix is downloaded, never built here.
    default: ""

outputs:
  prefix:
    value: ${{ steps.where.outputs.prefix }}

runs:
  using: composite
  steps:
    - id: where
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        ENVIRONMENT: ${{ runner.environment }}
      run: |
        v=$(sed -n 's/^VERSION=//p' llvm/build-libclang.sh)
        arch=${ARCH:-$RUNNER_ARCH}
        os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        case "$arch" in ARM64|arm64) ha=arm64 ;; X64|x64) ha=x64 ;; *) ha=$(printf '%s' "$arch" | tr '[:upper:]' '[:lower:]') ;; esac
        if [ "$RUNNER_OS" = Windows ]; then
          p="$LOCALAPPDATA\\rok\\libclang-$v"
        else
          p=$HOME/.cache/rok/libclang-$v
        fi
        [ "$ENVIRONMENT" = self-hosted ] && [ -f "$p/.complete" ] && echo "hit=true" >>"$GITHUB_OUTPUT"
        echo "prefix=$p" >>"$GITHUB_OUTPUT"
        echo "key=libclang-$RUNNER_OS-$arch-${{ runner.os == 'Windows' && hashFiles('llvm/build-libclang.ps1') || hashFiles('llvm/build-libclang.sh') }}" >>"$GITHUB_OUTPUT"
        echo "v=$v" >>"$GITHUB_OUTPUT"
        echo "host=$os-$ha" >>"$GITHUB_OUTPUT"
        echo "ROK_LIBCLANG_PREFIX=$p" >>"$GITHUB_ENV"

    - id: cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.where.outputs.key }}

    - name: Download prefix
      if: steps.cache.outputs.cache-hit != 'true' && steps.where.outputs.hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        V: ${{ steps.where.outputs.v }}
        HOST: ${{ steps.where.outputs.host }}
      run: |
        pfx=$ROK_LIBCLANG_PREFIX
        tmp=$RUNNER_TEMP
        if [ "$RUNNER_OS" = Windows ]; then
          pfx=$(cygpath -u "$ROK_LIBCLANG_PREFIX")
          tmp=$(cygpath -u "$RUNNER_TEMP")
        fi
        dir=$(dirname "$pfx")
        mkdir -p "$dir"
        a=rok-libclang-$V-$HOST.tar.gz
        gh release download "prefixes-$V" -R "$REPO" -p "$a" -p "$a.sha256" -D "$tmp" --clobber
        want=$(cut -d' ' -f1 "$tmp/$a.sha256")
        if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum "$tmp/$a" | cut -d' ' -f1); else got=$(shasum -a 256 "$tmp/$a" | cut -d' ' -f1); fi
        [ "$want" = "$got" ] || { echo "::error::sha256 mismatch for $a ($got != $want)"; exit 1; }
        tar -xzf "$tmp/$a" -C "$dir"
        [ -e "$pfx/.complete" ] || { echo "::error::$a did not extract a complete prefix at $pfx"; exit 1; }
        rm -f "$tmp/$a" "$tmp/$a.sha256"

    - name: Save cache
      if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.where.outputs.key }}
