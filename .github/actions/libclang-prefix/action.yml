name: libclang-prefix
description: >
  Restore the pinned libclang (llvm/build-libclang.sh, Windows .ps1) into
  ROK_LIBCLANG_PREFIX. Downloaded from S3 (llvm/<version>/<host>/
  libclang.tar.gz), SHA-256 verified, with the Actions cache as a fast layer
  on a hosted runner or the default cache dir on a self-hosted one. Published
  by prefixes.yml (Windows by prefixes-windows.yml). Run after llvm-prefix.

inputs:
  arch:
    description: The runner architecture (X64, ARM64) whose prefix to take instead of this runner's.
    default: ""
  build:
    description: Deprecated and ignored; the prefix is downloaded, never built here.
    default: ""

outputs:
  prefix:
    value: ${{ steps.where.outputs.prefix }}

runs:
  using: composite
  steps:
    - id: where
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        ENVIRONMENT: ${{ runner.environment }}
      run: |
        v=$(sed -n 's/^VERSION=//p' llvm/build-libclang.sh)
        arch=${ARCH:-$RUNNER_ARCH}
        os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
        case "$arch" in ARM64|arm64) ha=arm64 ;; X64|x64) ha=x64 ;; *) ha=$(printf '%s' "$arch" | tr '[:upper:]' '[:lower:]') ;; esac
        case "$os-$ha" in
          macos-arm64)   triple=aarch64-apple-darwin ;;
          macos-x64)     triple=x86_64-apple-darwin ;;
          linux-arm64)   triple=aarch64-unknown-linux-gnu ;;
          linux-x64)     triple=x86_64-unknown-linux-gnu ;;
          windows-arm64) triple=aarch64-pc-windows-msvc ;;
          windows-x64)   triple=x86_64-pc-windows-msvc ;;
          *) echo "::error::no prefix target triple for host $os-$ha"; exit 1 ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then
          p="$LOCALAPPDATA\\rok\\libclang-$v"
        else
          p=$HOME/.cache/rok/libclang-$v
        fi
        [ "$ENVIRONMENT" = self-hosted ] && [ -f "$p/.complete" ] && echo "hit=true" >>"$GITHUB_OUTPUT"
        echo "prefix=$p" >>"$GITHUB_OUTPUT"
        echo "key=libclang-$RUNNER_OS-$arch-${{ runner.os == 'Windows' && hashFiles('llvm/build-libclang.ps1') || hashFiles('llvm/build-libclang.sh') }}" >>"$GITHUB_OUTPUT"
        echo "v=$v" >>"$GITHUB_OUTPUT"
        echo "triple=$triple" >>"$GITHUB_OUTPUT"
        echo "ROK_LIBCLANG_PREFIX=$p" >>"$GITHUB_ENV"

    - id: cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.where.outputs.key }}

    - name: Download prefix
      if: steps.cache.outputs.cache-hit != 'true' && steps.where.outputs.hit != 'true'
      shell: bash
      env:
        BASE: https://rok-lang-artifacts.s3.us-east-1.amazonaws.com
        V: ${{ steps.where.outputs.v }}
        TRIPLE: ${{ steps.where.outputs.triple }}
      run: |
        pfx=$ROK_LIBCLANG_PREFIX
        tmp=$RUNNER_TEMP
        if [ "$RUNNER_OS" = Windows ]; then
          pfx=$(cygpath -u "$ROK_LIBCLANG_PREFIX")
          tmp=$(cygpath -u "$RUNNER_TEMP")
        fi
        dir=$(dirname "$pfx")
        mkdir -p "$dir"
        a=rok-libclang-$V-$TRIPLE.tar.gz
        url=$BASE/llvm/$V/$TRIPLE/libclang.tar.gz
        curl -fsSL "$url"        -o "$tmp/$a"
        curl -fsSL "$url.sha256" -o "$tmp/$a.sha256"
        want=$(cut -d' ' -f1 "$tmp/$a.sha256")
        if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum "$tmp/$a" | cut -d' ' -f1); else got=$(shasum -a 256 "$tmp/$a" | cut -d' ' -f1); fi
        [ "$want" = "$got" ] || { echo "::error::sha256 mismatch for $a ($got != $want)"; exit 1; }
        tar -xzf "$tmp/$a" -C "$dir"
        [ -e "$pfx/.complete" ] || { echo "::error::$a did not extract a complete prefix at $pfx"; exit 1; }
        rm -f "$tmp/$a" "$tmp/$a.sha256"

    - name: Save cache
      if: runner.environment == 'github-hosted' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.prefix }}
        key: ${{ steps.where.outputs.key }}
