name: publish llvm (windows)

# Publish the Windows LLVM prefix as an asset on the prefixes-<version>
# release, which .github/actions/llvm-prefix downloads. The prefix is
# box-built (a cold Windows build exceeds the 6 h job limit) and uploaded
# to the 'llvm-prefix' prerelease as llvm-win.tar.gz (the llvm-<v>/ tree);
# this re-packs it to the common asset name, verified by SHA-256. Run once
# per version (and whenever the box rebuilds the prefix).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: repack and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          v=$(sed -n 's/^VERSION=//p' llvm/build.sh)
          tmp=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$tmp/x" "$tmp/out"
          gh release download llvm-prefix -R "$REPO" -p llvm-win.tar.gz -O "$tmp/llvm-win.tar.gz" --clobber
          tar -xzf "$tmp/llvm-win.tar.gz" -C "$tmp/x"
          [ -d "$tmp/x/llvm-$v" ] || { echo "::error::llvm-win.tar.gz has no llvm-$v/ tree"; exit 1; }
          touch "$tmp/x/llvm-$v/.complete"
          a=rok-llvm-$v-windows-x64.tar.gz
          tar -C "$tmp/x" -czf "$tmp/out/$a" "llvm-$v"
          ( cd "$tmp/out" && { command -v sha256sum >/dev/null 2>&1 && sha256sum "$a" || shasum -a 256 "$a"; } > "$a.sha256" )
          gh release view "prefixes-$v" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "prefixes-$v" -R "$REPO" --prerelease --title "LLVM/libclang $v prefixes" \
              --notes "Prebuilt prefixes downloaded and verified by .github/actions/{llvm,libclang}-prefix." || true
          gh release upload "prefixes-$v" -R "$REPO" "$tmp/out/$a" "$tmp/out/$a.sha256" --clobber
